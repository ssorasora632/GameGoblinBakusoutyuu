<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ゴブリン爆走中(スマホ版)</title>

    <style>
        body {
            margin: 0;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        iframe {
        display: block;
        width: 95%;
        max-width: 800px;
        aspect-ratio: 16 / 10;
        height: auto;
        margin: 20px auto 0;
        border: none;
        }
        
        #credits {
    width: 800px;
    max-width: 90%;
    margin: 20px auto;
    padding: 20px;

    border: 1px solid #ccc;
    border-radius: 8px;
    background: #f5f5f5;

    text-align: left;
    white-space: pre-wrap;
    box-sizing: border-box;
}
    </style>
</head>

<body>

    <h1>ゴブリン爆走中(スマホ版)</h1>

    <iframe
        src="Game/index.html"
        width="960"
        height="600"
        allowfullscreen>
    </iframe>
    <h2>使用アセット</h2>
    <pre id="credits">読み込み中...</pre>
    
    <script>
    fetch("Credits.txt")
        .then(response => response.text())
        .then(text => {
            document.getElementById("credits").textContent = text;
        })
        .catch(() => {
            document.getElementById("credits").textContent =
                "クレジットを読み込めませんでした。";
        });
    </script>
</body>
</html>
